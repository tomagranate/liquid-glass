<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass — an Apple-style refraction material for the web</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__liquidGlassDemoErrors = [];
      const recordDemoError = (value) =>
        window.__liquidGlassDemoErrors.push(
          String(value?.stack || value),
        );
      window.addEventListener("error", (event) =>
        recordDemoError(event.error || event.message),
      );
      window.addEventListener("unhandledrejection", (event) =>
        recordDemoError(event.reason),
      );
      const originalConsoleError = console.error.bind(console);
      console.error = (...values) => {
        recordDemoError(values.join(" "));
        originalConsoleError(...values);
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
